[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-benchmark"
dynamic = ["version"]
description = "Benchmark a podcast against a peer set using only public data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["podcast", "benchmark", "rss", "podcast-index", "analytics", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
authors = [{ name = "Conor Bronsdon" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/conorbronsdon/podcast-benchmark"
Source = "https://github.com/conorbronsdon/podcast-benchmark"
Issues = "https://github.com/conorbronsdon/podcast-benchmark/issues"

[project.scripts]
podcast-benchmark = "podcast_benchmark.cli:main"

[tool.setuptools]
packages = ["podcast_benchmark"]

[tool.setuptools.dynamic]
version = { attr = "podcast_benchmark.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
